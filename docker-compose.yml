services:
  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: microservices-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ Service
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: microservices-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    networks:
      - microservices-network
    depends_on:
      - redis

  # Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT}
      PRODUCT_DATABASE_URL: ${PRODUCT_DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./product-service:/app
      - /app/node_modules
    networks:
      - microservices-network

  # Inventory Service
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - .env
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./inventory-service:/app
      - /app/node_modules
    networks:
      - microservices-network

  # Cart Service
  cart-service:
    build: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - .env
    environment:
      CART_SERVICE_PORT: ${CART_SERVICE_PORT}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./cart-service:/app
      - /app/node_modules
    networks:
      - microservices-network
    depends_on:
      - redis

  # Order Service
  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file:
      - .env
    environment:
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      ORDER_DATABASE_URL: ${ORDER_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./order-service:/app
      - /app/node_modules
    networks:
      - microservices-network
    depends_on:
      - rabbitmq

  # Payment Service
  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    env_file:
      - .env
    environment:
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./payment-service:/app
      - /app/node_modules
    networks:
      - microservices-network
    depends_on:
      - redis

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    env_file:
      - .env
    environment:
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT}
      RABBITMQ_URL: ${RABBITMQ_URL}
      NODE_ENV: ${NODE_ENV}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    networks:
      - microservices-network
    depends_on:
      - rabbitmq

  # Frontend
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${AUTH_SERVICE_URL}
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
      NEXT_PUBLIC_CART_SERVICE_URL: ${CART_SERVICE_URL}
      NEXT_PUBLIC_INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      NEXT_PUBLIC_ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - microservices-network

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  microservices-network:
    driver: bridge
